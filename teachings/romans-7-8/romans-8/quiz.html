<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Take the Quiz — Romans 8</title>
<meta name="description" content="Short interactive quiz on StayTheWay Ministry's teaching: Romans 8 — Life in the Spirit." />
<meta property="og:type" content="website">
<meta property="og:title" content="Teaching Quiz — Romans 8">
<meta property="og:description" content="10 questions covering Romans 8. Test your knowledge on life in the Spirit with instant feedback.">
<meta property="og:image" content="https://res.cloudinary.com/dyq7rnjjw/image/upload/c_fill,w_1200,h_630,g_center,q_auto,f_jpg/v1775094378/IMG_2196_waiddo.png">
<meta property="og:url" content="https://staytheway.com/teachings/romans-8/quiz.html">
<meta property="og:site_name" content="StayTheWay">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Teaching Quiz — Romans 8">
<meta name="twitter:description" content="10 questions covering Romans 8. Test your knowledge on life in the Spirit with instant feedback.">
<meta name="twitter:image" content="https://res.cloudinary.com/dyq7rnjjw/image/upload/c_fill,w_1200,h_630,g_center,q_auto,f_jpg/v1775094378/IMG_2196_waiddo.png">
<style>
  :root {
    --navy: #000014;
    --navy-2: #06112B;
    --blue: #1478F0;
    --sky: #28A0F0;
    --chrome: #DCDCDC;
    --white: #FFFFFF;
    --green: #3AC47B;
    --red:   #E0516C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--navy); color: var(--chrome);
    font-family: "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

  header { text-align: center; padding-bottom: 1.25rem;
    border-bottom: 3px solid var(--blue); position: relative; }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 3px;
    background: var(--white); }
  header .kicker { color: var(--sky); letter-spacing: 0.35em; font-weight: 900;
    font-size: 0.75rem; margin-bottom: 0.5rem; }
  header h1 { font-family: Georgia, serif; color: var(--white);
    margin: 0; font-size: clamp(1.7rem, 6vw, 2.4rem); }
  header .sub { color: var(--sky); font-style: italic; margin-top: 0.5rem;
    font-size: clamp(0.9rem, 3vw, 1.05rem); }

  .meta { display: flex; justify-content: space-between; align-items: center;
    margin: 1.25rem 0 0.75rem; font-size: 0.85rem; color: var(--sky);
    letter-spacing: 0.15em; text-transform: uppercase; font-weight: 900; }
  .progress { height: 6px; background: rgba(20,120,240,0.2); border-radius: 3px; overflow: hidden;
    margin-bottom: 1.5rem; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--blue), var(--sky));
    width: 0%; transition: width 0.3s ease; }

  .question {
    background: var(--navy-2); border: 1px solid var(--blue);
    border-left: 6px solid var(--white);
    padding: 1.25rem 1.25rem 1.5rem; margin-bottom: 1rem;
  }
  .q-text { font-family: Georgia, serif; font-size: clamp(1.1rem, 4vw, 1.3rem);
    color: var(--white); font-weight: 700; margin: 0 0 1.1rem; line-height: 1.35; }

  .options { display: grid; gap: 0.55rem; }
  .opt {
    display: block; padding: 0.85rem 1rem; background: rgba(20,120,240,0.07);
    border: 2px solid rgba(20,120,240,0.45); color: var(--chrome);
    cursor: pointer; font-size: 1rem; line-height: 1.4;
    text-align: left; font-family: inherit; width: 100%;
    transition: background 0.12s, border-color 0.12s;
  }
  .opt:hover { background: rgba(20,120,240,0.16); }
  .opt.correct { background: rgba(58,196,123,0.18); border-color: var(--green);
    color: var(--white); font-weight: 700; }
  .opt.wrong { background: rgba(224,81,108,0.18); border-color: var(--red); color: var(--white); }
  .opt[disabled] { cursor: default; }

  .feedback {
    margin-top: 1rem; padding: 0.85rem 1rem;
    font-size: 0.95rem; line-height: 1.5;
    background: var(--navy); border-left: 4px solid var(--sky);
  }
  .feedback.correct { border-left-color: var(--green); }
  .feedback.wrong   { border-left-color: var(--red); }
  .feedback strong { color: var(--white); }

  .nav { text-align: center; margin-top: 1rem; }
  .btn {
    background: var(--blue); color: var(--white); border: 2px solid var(--blue);
    padding: 0.8rem 1.6rem; font-weight: 900; letter-spacing: 0.08em;
    font-size: 0.95rem; cursor: pointer; font-family: inherit;
    border-radius: 4px;
  }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--sky); border-color: var(--sky); }

  .result {
    text-align: center; padding: 2rem 1.25rem;
    background: var(--navy-2); border: 1px solid var(--blue); border-left: 6px solid var(--white);
  }
  .result h2 { font-family: Georgia, serif; color: var(--white);
    font-size: clamp(1.8rem, 6vw, 2.5rem); margin: 0 0 0.5rem; }
  .result .score { font-size: 3rem; font-family: "Arial Black", sans-serif;
    color: var(--blue); margin: 0.5rem 0; }
  .result .score small { font-size: 1.2rem; color: var(--chrome); font-weight: 400; }
  .result p { color: var(--chrome); line-height: 1.5; font-family: Georgia, serif;
    font-style: italic; }
  .result .verse { color: var(--sky); font-style: italic; margin-top: 1.25rem;
    font-family: Georgia, serif; }

  footer { margin-top: 2.5rem; text-align: center; color: var(--chrome);
    border-top: 1px solid rgba(20,120,240,0.3); padding-top: 1.5rem; font-size: 0.85rem; }
  footer a { color: var(--sky); text-decoration: none; font-weight: 700; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="kicker">STAYTHEWAY MINISTRY  &bull;  TAKE THE QUIZ</div>
    <h1>Romans 8 — Life in the Spirit</h1>
    <div class="sub">Let's see what stuck</div>
  </header>

  <div id="quiz-area">
    <div class="meta">
      <span id="counter">Question 1 of 10</span>
      <span id="score-display">Score 0</span>
    </div>
    <div class="progress"><div id="progress-bar"></div></div>

    <div class="question">
      <h2 class="q-text" id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback" hidden></div>
    </div>

    <div class="nav">
      <button class="btn" id="next-btn" disabled>NEXT QUESTION</button>
    </div>
  </div>

  <div id="result-area" hidden>
    <div class="result">
      <h2>Well done.</h2>
      <div class="score" id="final-score">0<small> / 10</small></div>
      <p id="final-message"></p>
      <div class="verse">&ldquo;There is therefore now no condemnation to those who are in Christ Jesus.&rdquo;<br/>&mdash; Romans 8:1 (NKJV)</div>
      <div class="nav" style="margin-top:1.5rem;">
        <button class="btn ghost" onclick="location.reload()">RETAKE QUIZ</button>
      </div>
    </div>
  </div>

  <footer>
    <div>StayTheWay Ministry  &bull;  <a href="https://staytheway.com">staytheway.com</a></div>
  </footer>
</div>

<script>
const QUESTIONS = [
  {
    q: "There is now no ___ to those who are in Christ Jesus.",
    options: [
      "Punishment",
      "Condemnation",
      "Guilt",
      "Judgment"
    ],
    correct: 1,
    explain: "Romans 8:1 (NKJV) — 'There is therefore now no condemnation to those who are in Christ Jesus.' Condemnation is the specific word Paul uses."
  },
  {
    q: "What has made us free from the law of sin and death?",
    options: [
      "The law of Moses",
      "Our own willpower",
      "The law of the Spirit of life in Christ Jesus",
      "The Ten Commandments"
    ],
    correct: 2,
    explain: "Romans 8:2 — 'For the law of the Spirit of life in Christ Jesus has made me free from the law of sin and death.' It is a new law — the Spirit of life."
  },
  {
    q: "To be carnally minded is ___.",
    options: [
      "Weakness",
      "Foolishness",
      "Death",
      "Confusion"
    ],
    correct: 2,
    explain: "Romans 8:6 — 'For to be carnally minded is death.' Paul draws a stark line — the mind set on the flesh leads to death."
  },
  {
    q: "To be spiritually minded is ___.",
    options: [
      "Wisdom and understanding",
      "Life and peace",
      "Joy and gladness",
      "Strength and courage"
    ],
    correct: 1,
    explain: "Romans 8:6 — 'But to be spiritually minded is life and peace.' The Spirit brings both life and peace — not just one."
  },
  {
    q: "What spirit did believers NOT receive?",
    options: [
      "The spirit of power",
      "The spirit of adoption",
      "The spirit of bondage to fear",
      "The spirit of love"
    ],
    correct: 2,
    explain: "Romans 8:15 — 'For you did not receive the spirit of bondage again to fear, but you received the Spirit of adoption.' Fear and bondage are behind us."
  },
  {
    q: "By what name can we call God through the Spirit of adoption?",
    options: [
      "Lord Almighty",
      "Jehovah Jireh",
      "The Most High",
      "Abba, Father"
    ],
    correct: 3,
    explain: "Romans 8:15 — 'By whom we cry out, \"Abba, Father.\"' Abba is the intimate, personal name — like 'Daddy' or 'Papa.'"
  },
  {
    q: "If children, then ___.",
    options: [
      "Servants of God forever",
      "Heirs of God and joint heirs with Christ",
      "Students of the law",
      "Followers of the prophets"
    ],
    correct: 1,
    explain: "Romans 8:17 — 'And if children, then heirs — heirs of God and joint heirs with Christ.' We inherit everything alongside Jesus."
  },
  {
    q: "Who makes intercession for us with groanings which cannot be uttered?",
    options: [
      "The angels",
      "The prophets",
      "The Spirit",
      "The apostles"
    ],
    correct: 2,
    explain: "Romans 8:26 — 'The Spirit Himself makes intercession for us with groanings which cannot be uttered.' When we don't know how to pray, the Spirit does it for us."
  },
  {
    q: "All things work together for good to those who ___.",
    options: [
      "Follow the law perfectly",
      "Love God and are called according to His purpose",
      "Attend church every Sunday",
      "Tithe ten percent of their income"
    ],
    correct: 1,
    explain: "Romans 8:28 — 'All things work together for good to those who love God, to those who are the called according to His purpose.' Love and calling — that's the key."
  },
  {
    q: "What can separate us from the love of God in Christ Jesus?",
    options: [
      "Tribulation and persecution",
      "Death and life",
      "Angels and principalities",
      "Nothing!"
    ],
    correct: 3,
    explain: "Romans 8:38-39 — 'For I am persuaded that neither death nor life, nor angels nor principalities... shall be able to separate us from the love of God.' The answer is emphatic: NOTHING."
  }
];

let current = 0;
let score = 0;
let answered = false;

const counter   = document.getElementById("counter");
const scoreDisp = document.getElementById("score-display");
const progBar   = document.getElementById("progress-bar");
const qText     = document.getElementById("q-text");
const optsEl    = document.getElementById("options");
const feedback  = document.getElementById("feedback");
const nextBtn   = document.getElementById("next-btn");

function render() {
  const q = QUESTIONS[current];
  counter.textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
  scoreDisp.textContent = `Score ${score}`;
  progBar.style.width = `${(current / QUESTIONS.length) * 100}%`;
  qText.textContent = q.q;
  optsEl.innerHTML = "";
  q.options.forEach((text, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt";
    btn.textContent = text;
    btn.addEventListener("click", () => pick(i, btn));
    optsEl.appendChild(btn);
  });
  feedback.hidden = true; feedback.className = "feedback";
  nextBtn.disabled = true;
  nextBtn.textContent = (current === QUESTIONS.length - 1) ? "SEE RESULTS" : "NEXT QUESTION";
  answered = false;
}

function pick(i, btn) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[current];
  const buttons = [...optsEl.querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  buttons[q.correct].classList.add("correct");
  if (i === q.correct) {
    score += 1;
    feedback.className = "feedback correct";
    feedback.innerHTML = `<strong>Right.</strong> ${q.explain}`;
  } else {
    btn.classList.add("wrong");
    feedback.className = "feedback wrong";
    feedback.innerHTML = `<strong>Not quite.</strong> ${q.explain}`;
  }
  feedback.hidden = false;
  scoreDisp.textContent = `Score ${score}`;
  nextBtn.disabled = false;
}

nextBtn.addEventListener("click", () => {
  current += 1;
  if (current >= QUESTIONS.length) { showResult(); return; }
  render();
});

function showResult() {
  document.getElementById("quiz-area").hidden = true;
  document.getElementById("result-area").hidden = false;
  document.getElementById("final-score").innerHTML = `${score}<small> / ${QUESTIONS.length}</small>`;
  const msg = document.getElementById("final-message");
  if (score === QUESTIONS.length) {
    msg.textContent = "Perfect score. You are walking in the Spirit and nothing can separate you from His love.";
  } else if (score >= Math.ceil(QUESTIONS.length * 0.75)) {
    msg.textContent = "Strong work. The truths of Romans 8 are taking root \u2014 no condemnation, only life.";
  } else if (score >= Math.ceil(QUESTIONS.length * 0.5)) {
    msg.textContent = "Good start. Revisit the teaching and let the Spirit bring life and peace deeper.";
  } else {
    msg.textContent = "No condemnation. The Spirit is patient \u2014 replay the teaching and let it sink in.";
  }
}

render();
</script>
</body>
</html>
