<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Take the Quiz — 7 Marriages God Blessed</title>
<meta name="description" content="Short interactive quiz on StayTheWay Ministry's teaching: 7 Marriages God Blessed — grace over judgment in every covenant." />
<meta property="og:type" content="website">
<meta property="og:title" content="Teaching Quiz — 7 Marriages God Blessed">
<meta property="og:description" content="8 questions covering the 7 Marriages. Test your knowledge on how God blessed imperfect marriages with instant feedback.">
<meta property="og:url" content="https://staytheway.com/teachings/7-marriages-god-blessed/quiz.html">
<meta property="og:site_name" content="StayTheWay">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Teaching Quiz — 7 Marriages God Blessed">
<meta name="twitter:description" content="8 questions covering the 7 Marriages. Test your knowledge on how God blessed imperfect marriages with instant feedback.">
<style>
  :root {
    --navy: #000014;
    --navy-2: #06112B;
    --blue: #D4A847;
    --sky: #C97B7B;
    --chrome: #DCDCDC;
    --white: #FFFFFF;
    --green: #3AC47B;
    --red:   #E0516C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--navy); color: var(--chrome);
    font-family: "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

  header { text-align: center; padding-bottom: 1.25rem;
    border-bottom: 3px solid var(--blue); position: relative; }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 3px;
    background: var(--white); }
  header .kicker { color: var(--sky); letter-spacing: 0.35em; font-weight: 900;
    font-size: 0.75rem; margin-bottom: 0.5rem; }
  header h1 { font-family: Georgia, serif; color: var(--white);
    margin: 0; font-size: clamp(1.7rem, 6vw, 2.4rem); }
  header .sub { color: var(--sky); font-style: italic; margin-top: 0.5rem;
    font-size: clamp(0.9rem, 3vw, 1.05rem); }

  .meta { display: flex; justify-content: space-between; align-items: center;
    margin: 1.25rem 0 0.75rem; font-size: 0.85rem; color: var(--sky);
    letter-spacing: 0.15em; text-transform: uppercase; font-weight: 900; }
  .progress { height: 6px; background: rgba(212,168,71,0.2); border-radius: 3px; overflow: hidden;
    margin-bottom: 1.5rem; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--blue), var(--sky));
    width: 0%; transition: width 0.3s ease; }

  .question {
    background: var(--navy-2); border: 1px solid var(--blue);
    border-left: 6px solid var(--white);
    padding: 1.25rem 1.25rem 1.5rem; margin-bottom: 1rem;
  }
  .q-text { font-family: Georgia, serif; font-size: clamp(1.1rem, 4vw, 1.3rem);
    color: var(--white); font-weight: 700; margin: 0 0 1.1rem; line-height: 1.35; }

  .options { display: grid; gap: 0.55rem; }
  .opt {
    display: block; padding: 0.85rem 1rem; background: rgba(212,168,71,0.07);
    border: 2px solid rgba(212,168,71,0.45); color: var(--chrome);
    cursor: pointer; font-size: 1rem; line-height: 1.4;
    text-align: left; font-family: inherit; width: 100%;
    transition: background 0.12s, border-color 0.12s;
  }
  .opt:hover { background: rgba(212,168,71,0.16); }
  .opt.correct { background: rgba(58,196,123,0.18); border-color: var(--green);
    color: var(--white); font-weight: 700; }
  .opt.wrong { background: rgba(224,81,108,0.18); border-color: var(--red); color: var(--white); }
  .opt[disabled] { cursor: default; }

  .feedback {
    margin-top: 1rem; padding: 0.85rem 1rem;
    font-size: 0.95rem; line-height: 1.5;
    background: var(--navy); border-left: 4px solid var(--sky);
  }
  .feedback.correct { border-left-color: var(--green); }
  .feedback.wrong   { border-left-color: var(--red); }
  .feedback strong { color: var(--white); }

  .nav { text-align: center; margin-top: 1rem; }
  .btn {
    background: var(--blue); color: var(--white); border: 2px solid var(--blue);
    padding: 0.8rem 1.6rem; font-weight: 900; letter-spacing: 0.08em;
    font-size: 0.95rem; cursor: pointer; font-family: inherit;
    border-radius: 4px;
  }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--sky); border-color: var(--sky); }

  .result {
    text-align: center; padding: 2rem 1.25rem;
    background: var(--navy-2); border: 1px solid var(--blue); border-left: 6px solid var(--white);
  }
  .result h2 { font-family: Georgia, serif; color: var(--white);
    font-size: clamp(1.8rem, 6vw, 2.5rem); margin: 0 0 0.5rem; }
  .result .score { font-size: 3rem; font-family: "Arial Black", sans-serif;
    color: var(--blue); margin: 0.5rem 0; }
  .result .score small { font-size: 1.2rem; color: var(--chrome); font-weight: 400; }
  .result p { color: var(--chrome); line-height: 1.5; font-family: Georgia, serif;
    font-style: italic; }
  .result .verse { color: var(--sky); font-style: italic; margin-top: 1.25rem;
    font-family: Georgia, serif; }

  footer { margin-top: 2.5rem; text-align: center; color: var(--chrome);
    border-top: 1px solid rgba(212,168,71,0.3); padding-top: 1.5rem; font-size: 0.85rem; }
  footer a { color: var(--sky); text-decoration: none; font-weight: 700; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="kicker">STAYTHEWAY MINISTRY  &bull;  TAKE THE QUIZ</div>
    <h1>7 Marriages God Blessed</h1>
    <div class="sub">Let's see what stuck</div>
  </header>

  <div id="quiz-area">
    <div class="meta">
      <span id="counter">Question 1 of 8</span>
      <span id="score-display">Score 0</span>
    </div>
    <div class="progress"><div id="progress-bar"></div></div>

    <div class="question">
      <h2 class="q-text" id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback" hidden></div>
    </div>

    <div class="nav">
      <button class="btn" id="next-btn" disabled>NEXT QUESTION</button>
    </div>
  </div>

  <div id="result-area" hidden>
    <div class="result">
      <h2>Well done.</h2>
      <div class="score" id="final-score">0<small> / 8</small></div>
      <p id="final-message"></p>
      <div class="verse">&ldquo;Therefore what God has joined together, let not man separate.&rdquo;<br/>&mdash; Mark 10:9 (NKJV)</div>
      <div class="nav" style="margin-top:1.5rem;">
        <button class="btn ghost" onclick="location.reload()">RETAKE QUIZ</button>
      </div>
    </div>
  </div>

  <footer>
    <div>StayTheWay Ministry  &bull;  <a href="https://staytheway.com">staytheway.com</a></div>
  </footer>
</div>

<script>
const QUESTIONS = [
  {
    q: "Which couple waited 20 years for God to answer their prayer for children?",
    options: [
      "Abraham & Sarah",
      "Isaac & Rebekah",
      "Elkanah & Hannah",
      "Joseph & Mary"
    ],
    correct: 1,
    explain: "Genesis 25:21 \u2014 Isaac pleaded with the LORD for his wife for 20 years before Rebekah conceived."
  },
  {
    q: "Boaz called Ruth a \u2018virtuous woman.\u2019 What risky step had she just taken?",
    options: [
      "Left her homeland",
      "Gleaned in his field",
      "Came to the threshing floor at night",
      "Asked to marry him publicly"
    ],
    correct: 2,
    explain: "Ruth 3:11 \u2014 Boaz honored her boldness instead of shaming her vulnerability."
  },
  {
    q: "What was Elkanah\u2019s well-meaning but clumsy question to Hannah?",
    options: [
      "\u2018Why won\u2019t you eat?\u2019",
      "\u2018Am I not better to you than ten sons?\u2019",
      "\u2018Why are you crying again?\u2019",
      "\u2018Have you prayed about it?\u2019"
    ],
    correct: 1,
    explain: "1 Samuel 1:8 \u2014 He meant well but minimized her grief. Hannah took her pain to God instead."
  },
  {
    q: "Aquila and Priscilla are always mentioned together. What trade did they share with Paul?",
    options: [
      "Fishing",
      "Carpentry",
      "Tentmaking",
      "Tax collecting"
    ],
    correct: 2,
    explain: "Acts 18:3 \u2014 They turned a shared trade into a shared mission across the Roman Empire."
  },
  {
    q: "What was Joseph\u2019s first instinct when he learned Mary was pregnant?",
    options: [
      "Celebrate publicly",
      "Divorce her quietly",
      "Confront her family",
      "Flee to Egypt"
    ],
    correct: 1,
    explain: "Matthew 1:19 \u2014 He assumed the worst before God spoke, but obeyed immediately when corrected."
  },
  {
    q: "What did Sarah do when she couldn\u2019t wait for God\u2019s promise of a son?",
    options: [
      "Prayed harder",
      "Gave Hagar to Abraham",
      "Left Abraham",
      "Adopted a child"
    ],
    correct: 1,
    explain: "Genesis 16 \u2014 Both Abraham and Sarah tried to manufacture God\u2019s promise. But when Isaac came, they celebrated together."
  },
  {
    q: "In Ephesians 5, Paul says marriage is a mystery that pictures what relationship?",
    options: [
      "God and Israel",
      "Pastor and congregation",
      "Christ and the Church",
      "Father and children"
    ],
    correct: 2,
    explain: "Ephesians 5:31\u201332 \u2014 Every earthly marriage is meant to be a shadow of Christ\u2019s love for His bride."
  },
  {
    q: "What is the common thread in ALL 7 marriages we studied today?",
    options: [
      "They were all perfect",
      "They all had children",
      "One spouse gave grace instead of judgment",
      "They all lived in Israel"
    ],
    correct: 2,
    explain: "Every marriage had a shortcoming \u2014 and every shortcoming had a moment where grace won over judgment, pointing to Jesus the Bridegroom."
  }
];

let current = 0;
let score = 0;
let answered = false;

const counter   = document.getElementById("counter");
const scoreDisp = document.getElementById("score-display");
const progBar   = document.getElementById("progress-bar");
const qText     = document.getElementById("q-text");
const optsEl    = document.getElementById("options");
const feedback  = document.getElementById("feedback");
const nextBtn   = document.getElementById("next-btn");

function render() {
  const q = QUESTIONS[current];
  counter.textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
  scoreDisp.textContent = `Score ${score}`;
  progBar.style.width = `${(current / QUESTIONS.length) * 100}%`;
  qText.textContent = q.q;
  optsEl.innerHTML = "";
  q.options.forEach((text, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt";
    btn.textContent = text;
    btn.addEventListener("click", () => pick(i, btn));
    optsEl.appendChild(btn);
  });
  feedback.hidden = true; feedback.className = "feedback";
  nextBtn.disabled = true;
  nextBtn.textContent = (current === QUESTIONS.length - 1) ? "SEE RESULTS" : "NEXT QUESTION";
  answered = false;
}

function pick(i, btn) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[current];
  const buttons = [...optsEl.querySelectorAll(".opt")];
  buttons.forEach(b => b.disabled = true);
  buttons[q.correct].classList.add("correct");
  if (i === q.correct) {
    score += 1;
    feedback.className = "feedback correct";
    feedback.innerHTML = `<strong>Right.</strong> ${q.explain}`;
  } else {
    btn.classList.add("wrong");
    feedback.className = "feedback wrong";
    feedback.innerHTML = `<strong>Not quite.</strong> ${q.explain}`;
  }
  feedback.hidden = false;
  scoreDisp.textContent = `Score ${score}`;
  nextBtn.disabled = false;
}

nextBtn.addEventListener("click", () => {
  current += 1;
  if (current >= QUESTIONS.length) { showResult(); return; }
  render();
});

function showResult() {
  document.getElementById("quiz-area").hidden = true;
  document.getElementById("result-area").hidden = false;
  document.getElementById("final-score").innerHTML = `${score}<small> / ${QUESTIONS.length}</small>`;
  const msg = document.getElementById("final-message");
  if (score === QUESTIONS.length) {
    msg.textContent = "Perfect score. You see it clearly \u2014 every blessed marriage runs on grace, not perfection.";
  } else if (score >= Math.ceil(QUESTIONS.length * 0.75)) {
    msg.textContent = "Strong work. These marriages remind us that God\u2019s blessing covers our shortcomings.";
  } else if (score >= Math.ceil(QUESTIONS.length * 0.5)) {
    msg.textContent = "Good start. Revisit the teaching and let these marriages show you how grace wins.";
  } else {
    msg.textContent = "No condemnation. Every marriage we studied had messy moments \u2014 and God blessed them anyway. Try again.";
  }
}

render();
</script>
</body>
</html>
